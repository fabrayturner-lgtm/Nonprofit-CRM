<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = origFetch;

          Object.defineProperty(window, 'fetch', {
            get: function () {
              return customFetch;
            },
            set: function (fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return customFetch;
                },
                set: function (fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (e) {
            if (
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (
              e.reason &&
              typeof e.reason.message === 'string' &&
              e.reason.message.indexOf('Cannot set property fetch') !== -1
            ) {
              e.preventDefault();
              e.stopPropagation();
            }
          },
          true
        );
      })();
    </script>

    <meta property="og:description" content="A purpose-built relationship management and donor fundraising platform for MAPLE Inc. — Making Aging People Lives Easier." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
